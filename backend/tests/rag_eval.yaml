# RAG evaluation set (ADDENDUM-01 7.6). Every expected URL was checked against data/clean on 2026-10-19:
# the page text contains the answer. `expect` lists any source URL that counts as a hit at 4.
# Run: python tasks.py rag-eval   (one query embedding per question, one translation per non-English question)
